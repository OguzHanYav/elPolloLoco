<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
<script src="models/drawable-object.class.js"></script>
<script src="models/movable-object.class.js"></script>

<script src="models/status-bar.class.js"></script>
<script src="models/coins-bar.class.js"></script>
<script src="models/bottle-bar.class.js"></script>
<script src="models/endboss-bar.class.js"></script>

<script src="models/collectable-object.class.js"></script>

<script src="models/character.class.js"></script>

<script src="models/chicken.class.js"></script>
<script src="models/small-chicken.class.js"></script>
<script src="models/endBoss.class.js"></script>

<script src="models/cloud.class.js"></script>
<script src="models/background-object.class.js"></script>

<script src="models/thowable-object.class.js"></script>

<script src="js/game.js"></script>

  </head>

  <body>
    <div class="game-container">
      <canvas id="canvas" width="720" height="480"> </canvas>
      <div id="start-screen">
        <img
          id="start-img"
          src="img/9_intro_outro_screens/start/startscreen_1.png"
          alt=""
        />
        <button id="start-button">Start Game</button>
      </div>
      <div id="game-over-screen" style="display: none;">
        <img
          id="game-over-img"
          src="img/9_intro_outro_screens/game_over/oh no you lost!.png"
          alt="Game Over"
        />
        <button id="restart-button">Restart Game</button>
      </div>
      <div id="win-screen" style="display: none;">
        <img
          id="win-img"
          src="img/You won, you lost/You won A.png"
          alt="You Won"
        />
        <button id="restart-button-win">Restart Game</button>
      </div>
      <button id="fullscreen-btn">
        <img
          src="img/fullScreen.png"
          alt=""
        />
      </button>
    </div>
  </body>
</html>
