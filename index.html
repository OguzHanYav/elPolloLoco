<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/svg+xml" href="img/peppers-favicon.svg" />
    <script src="models/drawable-object.class.js"></script>
    <script src="models/movable-object.class.js"></script>

    <script src="models/status-bar.class.js"></script>
    <script src="models/coins-bar.class.js"></script>
    <script src="models/bottle-bar.class.js"></script>
    <script src="models/endboss-bar.class.js"></script>

    <script src="models/collectable-object.class.js"></script>

    <script src="models/character.class.js"></script>

    <script src="models/chicken.class.js"></script>
    <script src="models/small-chicken.class.js"></script>
    <script src="models/endBoss.class.js"></script>

    <script src="models/cloud.class.js"></script>
    <script src="models/background-object.class.js"></script>

    <script src="models/thowable-object.class.js"></script>

    <script src="models/level.class.js"></script>
    <script src="levels/level1.js"></script>

    <script src="models/keyboard.class.js"></script>

    <script src="models/world.class.js"></script>

    <script src="js/game.js"></script>
  </head>

  <body>
    <div class="game-container">
      <canvas id="canvas" width="720" height="480"> </canvas>
      <!--Start Screen-->
      <div id="start-screen">
        <img
          id="start-img"
          src="img/9_intro_outro_screens/start/startscreen_1.png"
          alt=""
        />
      </div>
      <!--Game Over-->
      <div id="game-over-screen" style="display: none">
        <img
          id="game-over-img"
          src="img/9_intro_outro_screens/game_over/oh no you lost!.png"
          alt="Game Over"
        />
        </div>
      <!--You Win-->
      <div id="win-screen" style="display: none">
        <img id="win-img"src="img/You won, you lost/You won A.png"alt="You Won"/>
        </div>
      <!--Button Box Right-->
      <div class="button-box">
            <img id="home-btn" src="img/home.ico" class="restart-img" />
            <img id="restart-btn" src="img/restart.ico" class="restart-img" />
        <button id="fullscreen-btn">
          <img src="img/fullScreen.png" alt="" />
        </button>
      </div>
      <!--Button Box Left-->
      <div class="button-box-left">
        <img id="play-btn" src="img/play-btn.ico" alt="Play" />
        <img id="mute-btn" src="img/volume-white-2.ico" class="mute-button" />
        <img
          id="info-btn"
          src="img/info-btn-white.ico"
          alt="info"
          class="info-icon"
        />
      </div>
      <div id="info-popup" class="popup hidden">
        <div class="popup-content">
          <h2>Game Instructions</h2>
          <ul>
            <li><b>D</b> – Throw bottle</li>
            <li><b>Space</b> – Jump</li>
            <li><b>Arrow keys</b> Left/Right – Move</li>
          </ul>
        </div>
      </div>
    </div>
  </body>
</html>
